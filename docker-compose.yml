services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldstack
      POSTGRES_PASSWORD: fieldstack
      POSTGRES_DB: fieldstack
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
